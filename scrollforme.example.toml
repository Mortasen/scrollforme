# Copy to scrollforme.toml (git-ignored) and edit.

# Where run folders (digest.json + digest.html) are written.
output_dir = "output"

# Folder of per-website modules (modules/reddit.com, modules/instagram.com, ...).
modules_dir = "modules"

[browser]
# Your everyday browser, with your own logins: "chrome" or "firefox".
# Chrome: turn on remote debugging once at chrome://inspect/#remote-debugging.
# Firefox: start it with --marionette (port below).
kind = "chrome"
marionette_port = 2828

[agent]
model = "claude-opus-5-5"
effort = "medium"
max_turns = 60          # per site visit
max_budget_usd = 1.0    # per site visit

# One entry per site visit. `module` names a folder in modules_dir; `description`
# says, in your own words, what you use that site for. Its browse() gets it verbatim.
[[sources]]
module = "reddit.com"
description = """I follow r/LocalLLaMA and r/selfhosted for new open models and self-hosting
tools. I want the day's notable posts, not memes or drama."""

[[sources]]
module = "instagram.com"
description = "I only use Instagram to see what my friends posted. Show new posts from people I follow."
