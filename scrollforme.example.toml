# Copy to scrollforme.toml (git-ignored) and edit.

# Where run folders (digest.json + digest.html) are written.
output_dir = "output"

[browser]
# A dedicated Chrome profile. Log in to each site once with `scrollforme login`.
profile_dir = "profile"
chrome_binary = "google-chrome"
headless = false

[mcp]
# How to start stealth-browser-mcp (https://github.com/vibheksoni/stealth-browser-mcp).
command = "~/.local/src/stealth-browser-mcp/.venv/bin/python"
args = ["~/.local/src/stealth-browser-mcp/src/server.py"]

[agent]
model = "claude-opus-5-5"
effort = "medium"
max_turns = 60          # per source
max_budget_usd = 1.0    # per source

[[sources]]
name = "r/LocalLLaMA"
url = "https://www.reddit.com/r/LocalLLaMA/top/?t=day"
max_items = 15

[[sources]]
name = "Instagram following"
url = "https://www.instagram.com/?variant=following"
max_items = 20
instructions = "Only posts from accounts I follow, newest first. Describe images briefly."
